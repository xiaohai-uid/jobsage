<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobSage (谋职) — UX/UI Prototype (Variants A/B/C)</title>
  <style>
    :root {
      --bg: oklch(98.5% 0.003 250);
      --surface: oklch(100% 0 0);
      --surface-2: oklch(96.5% 0.005 250);
      --fg: oklch(18% 0.015 250);
      --muted: oklch(50% 0.012 250);
      --muted-soft: oklch(65% 0.01 250);
      --border: oklch(91.5% 0.006 250);
      --border-strong: oklch(84% 0.01 250);
      --accent: oklch(56% 0.19 255);
      --accent-soft: oklch(95% 0.035 255);
      --accent-strong: oklch(48% 0.20 255);
      --success: oklch(52% 0.13 155);
      --success-soft: oklch(94.5% 0.04 155);
      --warn: oklch(56% 0.14 75);
      --warn-soft: oklch(94.5% 0.05 75);
      --danger: oklch(52% 0.16 25);
      --danger-soft: oklch(94.5% 0.04 25);
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Consolas, 'Fira Code', monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.02);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.03);
    }

    [data-theme="dark"] {
      --bg: oklch(14% 0.012 250);
      --surface: oklch(18% 0.014 250);
      --surface-2: oklch(22% 0.016 250);
      --fg: oklch(94% 0.005 250);
      --muted: oklch(68% 0.01 250);
      --muted-soft: oklch(48% 0.01 250);
      --border: oklch(26% 0.015 250);
      --border-strong: oklch(34% 0.018 250);
      --accent: oklch(66% 0.18 255);
      --accent-soft: oklch(25% 0.05 255);
      --accent-strong: oklch(72% 0.18 255);
      --success: oklch(65% 0.13 155);
      --success-soft: oklch(25% 0.04 155);
      --warn: oklch(68% 0.14 75);
      --warn-soft: oklch(26% 0.05 75);
      --danger: oklch(62% 0.16 25);
      --danger-soft: oklch(26% 0.04 25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .app-header {
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      width: 26px;
      height: 26px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.5px;
    }
    .brand-title {
      font-weight: 650;
      font-size: 14px;
      letter-spacing: -0.2px;
    }
    .brand-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theme-toggle, .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .theme-toggle:hover, .btn-ghost:hover {
      background: var(--surface-2);
    }

    /* Main Container */
    .app-main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Floating Switcher */
    .prototype-switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-lg);
      border-radius: 999px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(8px);
    }
    .switcher-btn {
      background: var(--surface-2);
      border: none;
      color: var(--fg);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.15s;
    }
    .switcher-btn:hover {
      background: var(--border-strong);
    }
    .switcher-title {
      color: var(--fg);
      font-weight: 650;
      padding: 0 4px;
    }
    .switcher-hint {
      color: var(--muted-soft);
      font-size: 10.5px;
      border-left: 1px solid var(--border);
      padding-left: 8px;
    }

    /* Common Card Styles */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-ok { background: var(--success-soft); color: var(--success); }
    .badge-warn { background: var(--warn-soft); color: var(--warn); }
    .badge-accent { background: var(--accent-soft); color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.92; }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      top: 60px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--success);
      color: var(--fg);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 2000;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========================================================
       VARIANT A: Command Center (极速生产力 · 双栏与直聊一体化)
       ======================================================== */
    .variant-a {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
      padding: 16px;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .va-editor-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 12px;
      overflow: hidden;
    }
    .va-editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .va-split-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .va-editor-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .va-pane-title {
      padding: 6px 12px;
      background: var(--surface-2);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .va-textarea {
      flex: 1;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      background: transparent;
      border: none;
      color: var(--fg);
      resize: none;
      outline: none;
      line-height: 1.6;
    }
    .va-preview-pane {
      padding: 14px 18px;
      overflow-y: auto;
      font-size: 12.5px;
      line-height: 1.65;
    }
    .va-preview-pane h1 { font-size: 18px; margin-bottom: 6px; font-weight: 700; color: var(--fg); }
    .va-preview-pane h2 { font-size: 14px; margin: 12px 0 6px; font-weight: 650; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 3px; }
    .va-preview-pane ul { padding-left: 18px; margin-bottom: 8px; }
    .va-preview-pane li { margin-bottom: 4px; }
    .va-preview-pane .tag-ref { color: var(--muted); font-size: 10.5px; font-family: var(--font-mono); }

    /* Right Action Deck */
    .va-action-deck {
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
      overflow-y: auto;
    }
    .boss-greeting-card {
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .boss-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .boss-tag-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .boss-icon {
      width: 20px;
      height: 20px;
      background: #00bebd; /* BOSS Brand Color */
      color: #fff;
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
    }
    .boss-text-area {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--fg);
      resize: vertical;
      min-height: 90px;
      margin-bottom: 10px;
      outline: none;
    }
    .boss-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .char-meter {
      font-size: 11.5px;
      color: var(--muted);
    }
    .char-meter.optimal {
      color: var(--success);
      font-weight: 600;
    }

    /* Diagnosis mini bars */
    .fit-summary-card {
      padding: 14px;
    }
    .fit-score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .fit-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fit-bar-item {
      display: grid;
      grid-template-columns: 80px 1fr 35px;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
    }
    .bar-track {
      height: 6px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* ========================================================
       VARIANT B: Candidate Studio (阶段沉浸式工作台 · 多 JD 抽屉)
       ======================================================== */
    .variant-b {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .vb-drawer {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .vb-drawer-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 650;
      font-size: 12.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vb-jd-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vb-jd-card {
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .vb-jd-card:hover {
      background: var(--surface-2);
    }
    .vb-jd-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .vb-jd-title { font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
    .vb-jd-sub { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

    .vb-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px 20px;
      gap: 14px;
    }
    .vb-stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .vb-step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .vb-step.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .vb-step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface-2);
      display: grid;
      place-items: center;
      font-size: 11px;
    }
    .vb-step.active .vb-step-num {
      background: var(--accent);
      color: #fff;
    }
    .vb-stage-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Simulation Timeline Box */
    .timeline-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .tl-item.done { color: var(--success); font-weight: 600; }
    .tl-item.active { color: var(--accent); font-weight: 600; }
    .tl-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-strong);
    }
    .tl-item.done .tl-dot { background: var(--success); }
    .tl-item.active .tl-dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ========================================================
       VARIANT C: Zen Editorial (极简瑞士排版与暗色模式)
       ======================================================== */
    .variant-c {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 30px 20px 80px;
    }
    .vc-paper {
      width: 100%;
      max-width: 780px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 48px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .vc-header {
      border-bottom: 2px solid var(--fg);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .vc-candidate-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .vc-meta {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .vc-section-title {
      font-size: 14px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-top: 10px;
    }
    .vc-exp-block {
      border-left: 2px solid var(--border-strong);
      padding-left: 14px;
      margin-left: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vc-exp-head {
      display: flex;
      justify-content: space-between;
      font-weight: 650;
      font-size: 13.5px;
    }
    .vc-exp-bullet {
      color: var(--fg);
      font-size: 13px;
      line-height: 1.6;
    }
    .vc-floating-greeting {
      position: sticky;
      bottom: 20px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>
<body data-theme="light">

  <!-- Toast Message -->
  <div id="toast" class="toast-msg">
    <span>✅</span>
    <span id="toast-text">已成功复制到剪贴板！</span>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-cluster">
      <div class="brand-badge">谋</div>
      <div class="brand-title">JobSage 谋职</div>
      <span class="brand-tag">UX/UI Prototype v2</span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> 暗黑模式
      </button>
      <button class="btn-ghost" onclick="triggerSimulateProgress()">
        ⚡ 模拟 4 步推理进度
      </button>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="app-main" id="view-container">
    <!-- Variants will be rendered here dynamically -->
  </main>

  <!-- Prototype Switcher (Floating Bar) -->
  <div class="prototype-switcher">
    <button class="switcher-btn" onclick="prevVariant()" title="上一变体 (←)">◀</button>
    <span class="switcher-title" id="variant-label">Variant A — Command Center (直聊+分栏)</span>
    <button class="switcher-btn" onclick="nextVariant()" title="下一变体 (→)">▶</button>
    <span class="switcher-hint">快捷键 ← / → 切换</span>
  </div>

  <script>
    // State
    const VARIANTS = [
      { id: 'A', label: 'Variant A — Command Center (极速直聊 & Markdown 双栏)' },
      { id: 'B', label: 'Variant B — Candidate Studio (阶段工作台 & 多 JD 抽屉)' },
      { id: 'C', label: 'Variant C — Zen Editorial (极简排版 & 沉浸式阅读)' }
    ];

    let currentVariantIdx = 0;
    let resumeText = `# 陈思齐
**资深前端架构师** · 清华大学硕士 · 6年一线互联网大厂架构经验

## 核心经历
- 主导全集团前端设计系统与组件库基建，覆盖 20+ 业务线，研发效率提升 35%
- 推动微前端与 ESM 模块联邦架构落地，主导 Webpack 到 Vite/Rspack 迁移，打包耗时缩短 60%
- 主导千万级 DAU 业务性能极限调优，LCP 降至 0.8s，首屏秒开率从 72% 提升至 96%
- 设计高可用前端监控与错误溯源中台，线上崩溃率降低 45%

## 关键技术栈
TypeScript, React, Next.js, Node.js, Webpack, Vite, 微前端, 性能调优`;

    let greetingText = `您好！关注到贵司正在招聘资深前端架构师，我的背景与岗位高度契合：
1. 6年大厂前端中台基建经验，曾主导20+业务线的设计系统统一；
2. 精通Webpack/Vite构建体系与微前端架构，曾将打包耗时优化60%；
3. 主导千万级DAU性能极限调优，LCP达到0.8s标准。
期待能与您深入沟通！`;

    function getParamVariant() {
      const p = new URLSearchParams(window.location.search).get('variant');
      const idx = VARIANTS.findIndex(v => v.id === p);
      return idx >= 0 ? idx : 0;
    }

    function setVariant(idx) {
      currentVariantIdx = idx;
      const v = VARIANTS[idx];
      document.getElementById('variant-label').textContent = v.label;
      const url = new URL(window.location);
      url.searchParams.set('variant', v.id);
      window.history.replaceState({}, '', url);
      renderCurrentVariant();
    }

    function prevVariant() {
      setVariant((currentVariantIdx - 1 + VARIANTS.length) % VARIANTS.length);
    }
    function nextVariant() {
      setVariant((currentVariantIdx + 1) % VARIANTS.length);
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.key === 'ArrowLeft') prevVariant();
      if (e.key === 'ArrowRight') nextVariant();
    });

    // Theme toggle
    function toggleTheme() {
      const b = document.body;
      const isDark = b.getAttribute('data-theme') === 'dark';
      b.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
    }

    // Copy to clipboard with toast
    function copyText(text, label = "BOSS 直聘破冰打招呼语") {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`已成功复制【${label}】！`);
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // Render markdown to simple HTML
    function mdToHtml(md) {
      return md
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^\- (.*$)/gim, '<li>$1</li>')
        .replace(/\*\*(.*)\*\*/gim, '<b>$1</b>')
        .replace(/\n\n/gim, '<br>');
    }
